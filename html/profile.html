    <section class="profile-section">

            <div class="profile-info"
                style="background: #f4f4f4; padding: 20px; border-radius: 8px; margin-bottom: 30px;">

            <h3>Bookings / Offered Rides</h3>
            <!-- Container for both Bookings (Passenger) and Offered Rides (Driver) -->
