<!DOCTYPE html>

  <link rel = "icon" type="img/png" href="images\GaariYaari logo tab.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <a href="index.html" class="logo">
      <img src="images\GaariYaari_navbar.png" alt="GaariYaari Logo">
    </a>
    <nav>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="find-ride.html">Find a Ride</a></li>

      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html" class="auth-link">Login</a></li>
    </ul>
  </nav>
  </header>

  <!-- Offer Ride Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Share Your Journey with <span>GaariYaari</span></h1>
      <p>Post your ride and help others travel smart and affordably.</p>
    </div>
  </section>
  <br><br>

  <section class="offer-form-section">
    <h2>Offer a Ride</h2>
    <form class="ride-form offer-form">
      <input type="text" placeholder="Pickup Location" required>
      <input type="text" placeholder="Drop Location" required>
      <input type="datetime-local" required>
      <input type="number" placeholder="Available Seats" min="1" required>
      <input type="number" placeholder="Cost per Seat (PKR)" min="0" required>
      <button type="submit">Post Ride</button>
    </form>
  </section>
  <br><br>

  <!-- Footer -->
